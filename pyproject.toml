[project]
name = "statline-mcp"
version = "0.1.0"
description = "MCP server voor de CBS StatLine OData API: doorzoek de tabellencatalogus, verken structuur en vraag data op."
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.scripts]
statline-mcp = "statline_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statline_mcp"]
